name: BEBELLA Web PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bebela-pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Stage BEBELA images
        run: |
          mkdir -p public/_cdn/static
          cp -v _cdn/static/*.png public/_cdn/static/
          cp -v bebela-icon.png public/bebela-icon.png
      - name: Optimize web images
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/optimize-web-images.py
      - name: Build site
        env:
          BEBELA_GITHUB_PAGES: 'true'
        run: |
          npm run build
          node scripts/build-pwa.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

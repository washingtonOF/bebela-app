name: BEBELA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Imagens hospedadas pelo Floot exigem exportação autorizada.
      # A compilação de diagnóstico segue sem esses arquivos até a migração dos assets.
      - name: Stage BEBELA visual assets
        run: |
          mkdir -p public/_cdn/static
          cp -v _cdn/static/*.png public/_cdn/static/
          cp -v bebela-icon.png public/bebela-icon.png
      - name: Build web app
        run: npm run build
      - name: Add Android project
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Set BEBELA Android launcher icon
        run: |
          if [ -f public/bebela-icon.png ]; then
            python3 -m pip install --quiet pillow
            python3 scripts/create_android_icons.py public/bebela-icon.png android/app/src/main/res
          else
            echo "::warning::Ícone BEBELA ausente: envie public/bebela-icon.png ao repositório para substituir o ícone padrão."
          fi
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: BEBELA-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
